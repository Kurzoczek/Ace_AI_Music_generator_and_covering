org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# CPU architecture level for the native engine (acestep.cpp / ggml).
#   armv8.2-a+dotprod+fp16   - default: much faster int8/fp16 math; phones from ~2018-2019 on (Cortex-A55/A75 and newer)
#   armv8-a                  - only needed for very old phones (Cortex-A53/A73 only); the engine crashes there otherwise
aceArmArch=armv8.2-a+dotprod+fp16
# compileSdk 36 (Android 16) with AGP 8.7: silences the "newer than tested" warning.
android.suppressUnsupportedCompileSdk=36
# "Report content" button (required by Google Play for AI generators): e-mail address that receives reports.
# Empty = the button opens a new GitHub issue in this repository instead (aceReportUrl).
aceReportEmail=
