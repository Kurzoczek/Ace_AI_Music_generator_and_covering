org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# CPU architecture level for the native engine (acestep.cpp / ggml).
#   armv8.2-a+dotprod+fp16   - default: much faster int8/fp16 math; phones from ~2018-2019 on (Cortex-A55/A75 and newer)
#   armv8-a                  - only needed for very old phones (Cortex-A53/A73 only); the engine crashes there otherwise
aceArmArch=armv8.2-a+dotprod+fp16
