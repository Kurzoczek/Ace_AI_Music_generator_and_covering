name: Release

# Builds a signed release APK + AAB (Google Play).
#   APK -> GitHub Release vX.Y.Z (visible to everyone who can see the repository)
#   AAB -> DRAFT release vX.Y.Z-play (drafts are visible only to people with write access to the repository,
#          even when the repository is public; it is never published, the AAB is only for uploading to Google Play)
# From the phone: Actions -> Release -> Run workflow -> enter the version (e.g. 1.1.0) -> Run workflow.
# Also runs when a tag like v1.1.0 is pushed.
# Description of the release: the section of CHANGELOG.md for this version, or its "Unreleased" section
# (tools/release_notes.py); without either, the commits since the previous tag.
#
# Signing: the release key from the ACE_KEYSTORE_* secrets if they exist (use this one for Google Play);
# otherwise the debug key from the ACE_DEBUG_KEYSTORE_* secrets, so the APK installs over the debug builds.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.1.0)
        required: true
        type: string
  push:
    tags: [ 'v*' ]

permissions:
  contents: write     # create the tag and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$v' is not a version like 1.1.0"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # full history and tags: release notes fall back to the commits since the last tag

      - name: Release notes from CHANGELOG.md
        run: |
          python3 tools/release_notes.py "${{ steps.v.outputs.version }}" > "$RUNNER_TEMP/notes.md"
          echo "----- release notes -----"; cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36"

      - name: Signing key from secrets
        env:
          RELEASE_B64: ${{ secrets.ACE_KEYSTORE_BASE64 }}
          DEBUG_B64: ${{ secrets.ACE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_B64" ]; then
            echo "$RELEASE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ACE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key (ACE_KEYSTORE_*)."
          elif [ -n "$DEBUG_B64" ]; then
            echo "$DEBUG_B64" | base64 -d > "$RUNNER_TEMP/ace-debug.p12"
            echo "ACE_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/ace-debug.p12" >> "$GITHUB_ENV"
            echo "::notice::No release key - signing with the debug key (ACE_DEBUG_KEYSTORE_*). Fine for installing from GitHub; for Google Play add the ACE_KEYSTORE_* secrets."
          else
            echo "::error::No signing key: add the ACE_DEBUG_KEYSTORE_* (or ACE_KEYSTORE_*) secrets - see README."
            exit 1
          fi

      - name: Build release APK and AAB
        env:
          ACE_KEYSTORE_PASSWORD: ${{ secrets.ACE_KEYSTORE_PASSWORD }}
          ACE_KEY_ALIAS: ${{ secrets.ACE_KEY_ALIAS }}
          ACE_KEY_PASSWORD: ${{ secrets.ACE_KEY_PASSWORD }}
          ACE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ACE_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon -PaceVersionName=${{ steps.v.outputs.version }} assembleRelease bundleRelease
          cd app/build/outputs
          mv apk/release/*.apk "apk/release/AceMusicGen-${{ steps.v.outputs.tag }}.apk"
          mv bundle/release/*.aab "bundle/release/AceMusicGen-${{ steps.v.outputs.tag }}.aab"
          ls -la apk/release bundle/release

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ace-debug.p12"

      - name: Publish GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true     # adds the "Full Changelog" comparison link under the notes
          files: app/build/outputs/apk/release/*.apk

      - name: Private draft with the Google Play bundle (AAB)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.v.outputs.tag }}-play
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.tag }} - Google Play bundle (private draft, do not publish)
          body: |
            Draft = visible only to people with write access to this repository.
            Download the .aab and upload it in Google Play Console. Do not publish this draft.
          files: app/build/outputs/bundle/release/*.aab
