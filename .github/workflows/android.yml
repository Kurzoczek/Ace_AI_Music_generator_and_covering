name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEY: ${{ secrets.ACE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout (with the acestep.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"

      - name: Python core is in sync with the desktop script
        run: |
          python3 tools/build_ace_core.py tools/generate_small_pro_ace_android.py /tmp/ace_core.py
          diff -q /tmp/ace_core.py app/src/main/python/ace_core.py

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceMusicGen-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Signing key from secrets (Optional)
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.ACE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (Optional - if key exists)
        if: env.HAS_KEY == 'true'
        env:
          ACE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ACE_KEYSTORE_PASSWORD: ${{ secrets.ACE_KEYSTORE_PASSWORD }}
          ACE_KEY_ALIAS: ${{ secrets.ACE_KEY_ALIAS }}
          ACE_KEY_PASSWORD: ${{ secrets.ACE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AceMusicGen v1.0.${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
