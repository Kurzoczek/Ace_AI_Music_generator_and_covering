name: Android build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '*.zip', 'incoming/**' ]   # a ZIP upload is built after the Import project ZIP workflow unpacks it
  pull_request:
  workflow_dispatch:
  workflow_call:              # used by "Import project ZIP" to build the commit it has just made
    inputs:
      ref:
        description: Commit to build
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with the acestep.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36"

      - name: Python core is in sync with the desktop script
        run: |
          python3 tools/build_ace_core.py tools/generate_small_pro_ace_android.py /tmp/ace_core.py
          diff -q /tmp/ace_core.py app/src/main/python/ace_core.py

      - name: Debug signing key from secrets
        env:
          KEY_B64: ${{ secrets.ACE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/ace-debug.p12"
            echo "ACE_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/ace-debug.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ACE_DEBUG_KEYSTORE_BASE64 secret missing - this APK has a one-off key and will not install as an update."
          fi

      - name: Build debug APK
        env:
          ACE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ACE_DEBUG_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ace-debug.p12"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AceMusicGen-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

